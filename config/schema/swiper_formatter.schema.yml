  mapping:
    template:
      type: string
      label: 'Swiper template'
    caption:
      type: string
      label: 'Caption field'
field.formatter.settings.swiper_formatter_entity_dialog:
  type: field.formatter.settings.swiper_formatter_entity
  label: 'Swiper dialog entity formatter settings'
  mapping: swiper_formatter_dialog

field.formatter.settings.swiper_formatter_image:
  type: field.formatter.settings.image
  label: 'Swiper images formatter settings'
  mapping:
    template:
      type: string
      label: 'Swiper template'
    caption:
      type: string
      label: 'Caption field'
    custom_link:
      type: string
      label: 'Image link'

field.formatter.settings.swiper_formatter_image_dialog:
  type: field.formatter.settings.swiper_formatter_image
  label: 'Swiper dialog images formatter settings'
  mapping: swiper_formatter_dialog

field.formatter.swiper_formatter_text:
  type: field.formatter.settings.text_trimmed
  label: 'Swiper text formatter settings'
  mapping:
    template:
      type: string
      label: 'Swiper template'
    caption:
      type: string
      label: 'Caption field'

field.formatter.settings.swiper_formatter_text_dialog:
  type: field.formatter.swiper_formatter_text
  label: 'Swiper dialog text formatter settings'
  mapping: swiper_formatter_dialog
